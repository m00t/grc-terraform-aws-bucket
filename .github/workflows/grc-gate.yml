# grc-gate: run the policy gate on every pull request.

name: grc-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  grc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Log in to AWS with OIDC: no stored keys, temporary read-only session.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Install Terraform at a pinned version.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # Generate the plan in CI from main.tf, instead of trusting a committed plan.json.
      - name: Generate Terraform plan
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan -var="environment=dev" -var="project_name=compliance-lab"
          terraform show -json tfplan > plan.json

      #  Installs Conftest (pins a version, does not use the latest)
      - name: Install Conftest
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v0.62.0/conftest_0.62.0_Linux_x86_64.tar.gz" | tar xz conftest
          sudo mv conftest /usr/local/bin/
          conftest --version
          
      #   Runs three policy namespaces against the plan generated above.
      #       Writes the results to evidence/conftest-results.json.
      #       Fails the job if any namespace reports a failure.
      - name: Run policy gate
        id: gate
        run: |
          mkdir -p evidence
          set +e
          conftest test plan.json \
            --policy policies \
            --namespace compliance.sc28_aws \
            --namespace compliance.ac3_aws \
            --namespace compliance.cm6_aws \
            --output json > evidence/conftest-results.json
          status=$?
          set -e
          cat evidence/conftest-results.json
          cp plan.json evidence/plan.json
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Install Cosign at a pinned version.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      # Bundle the evidence, record its hash, and sign it keyless with the workflow's OIDC identity.
      - name: Bundle, hash and sign evidence
        run: |
          tar -czf evidence.tar.gz evidence/
          sha256sum evidence.tar.gz > evidence.tar.gz.sha256
          cosign sign-blob --yes --bundle evidence.sig.bundle evidence.tar.gz
      
            # Preservation: copy the signed evidence into the Object Lock vault (write-once).
      
      # Runs only when the VAULT_BUCKET repository variable is set.
      - name: Upload evidence to vault
        if: ${{ vars.VAULT_BUCKET != '' }}
        env:
          VAULT_BUCKET: ${{ vars.VAULT_BUCKET }}
        run: |
          prefix="evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for f in evidence.tar.gz evidence.tar.gz.sha256 evidence.sig.bundle; do
            aws s3api put-object --bucket "$VAULT_BUCKET" --key "$prefix/$f" --body "$f" --checksum-algorithm SHA256 > /dev/null
          done
          echo "Vaulted to s3://$VAULT_BUCKET/$prefix/"    

      # Uploads evidence/ as a build artifact, with `if: always()` so the evidence is saved even when the gate fails. CI evidence survives the failure.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grc-gate-evidence
          path: |
            evidence.tar.gz
            evidence.tar.gz.sha256
            evidence.sig.bundle

     # Fail closed: the pass/fail decision runs last, after evidence is signed and uploaded.
      - name: Enforce gate result
        run: |
          echo "Policy gate exit status: ${{ steps.gate.outputs.status }}"
          if [ "${{ steps.gate.outputs.status }}" != "0" ]; then
            echo "One or more policies failed. Blocking."
            exit 1
          fi